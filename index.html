<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Portfolio Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tv-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <h2>Portfolio</h2>
            <div class="nav-item searchable active" data-target="logos">Logo Designs</div>
            <div class="nav-item searchable" data-target="slides">Presentations</div>
            <div class="nav-item searchable" data-target="branding">Branded Creative</div>
        </div>

        <!-- Main Content Area Grid -->
        <div class="main-content">
            <h1 id="category-title">Logo Designs</h1>
            <div class="grid-container" id="portfolio-grid">
                <!-- Grid items will feature your designs -->
                <div class="grid-item searchable"><img src="images/logo1.png" alt="Logo 1"><p>Brand Logo 1</p></div>
                <div class="grid-item searchable"><img src="images/logo2.png" alt="Logo 2"><p>Brand Logo 2</p></div>
                <div class="grid-item searchable"><img src="images/logo3.png" alt="Logo 3"><p>Brand Logo 3</p></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
